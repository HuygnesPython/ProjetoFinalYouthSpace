{% extends 'base.html' %}
{% block conteudo %}

<h2>Gerenciar Peças</h2>

<hr>

<form action="{{url_for('cadastrar_pecas')}}" method="POST">

    <label>Nome da Peça:</label><br>
    <input type="text" name="nome" class="form-control" required>
    <br><br>

    <label>Código:</label><br>
    <input type="text" name="codigo" class="form-control" required>
    <br><br>

    <label>Quantidade em Estoque:</label><br>
    <input type="number" name="quantidade_estoque" class="form-control" required>
    <br><br>

    <label>Custo:</label><br>
    <input type="number" step="0.01" name="custo" class="form-control" required>
    <br><br>

    <label>Preço de Venda:</label><br>
    <input type="number" step="0.01" name="preco_venda" class="form-control" required>
    <br><br>

    <label>Observações:</label><br>
    <textarea name="observacoes" class="form-control"></textarea>
    <br><br>

    <button type="submit" class="form-control btn btn-primary">Cadastrar Peça</button>

</form>

<hr>

<a href="/">Voltar</a>

{% endblock %}
